name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          # 💡 Explicitly tell setup-node where to look for the lockfile
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install deps
        # 💡 If this fails again, try --no-frozen-lockfile to debug
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -w build
